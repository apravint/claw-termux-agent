name: Claw Termux Agent CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Run Unit Tests
        run: |
          python -m unittest discover -s tests -p "test_*.py"
      - name: Test CLI commands
        run: |
          clawagent search "Linux Terminal AI"
          clawagent monitor "github.com/apravint"
          clawagent logs
